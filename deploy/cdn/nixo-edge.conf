# NIXO edge / CDN example. No secrets. Origin is private.
# HTTP/2; HTTP/3 when the listener is enabled. Gzip fallback; Brotli via ngx_brotli.
proxy_cache_path /var/cache/nixo levels=1:2 keys_zone=nixo_cdn:32m max_size=2g inactive=24h;

geo $nixo_edge_limit {
  default 40r/m;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=nixo_auth:10m rate=8r/m;
limit_req_zone $binary_remote_addr zone=nixo_search:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=nixo_ai:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=nixo_pay:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nixo_dl:10m rate=20r/m;

upstream nixo_origin {
  server origin.nixo.internal:43151 max_fails=3 fail_timeout=15s;
  keepalive 32;
}

server {
  listen 443 ssl http2;
  # listen 443 quic reuseport;
  # listen [::]:443 ssl http2;

  if ($host !~* ^(nixo\.example|localhost|127\.0\.0\.1)$) { return 421; }

  gzip on;
  gzip_types text/css application/javascript application/json font/woff2 image/svg+xml;

  location /_next/static/ {
    proxy_pass http://nixo_origin;
    proxy_cache nixo_cdn;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;
  }

  location /icons/ {
    proxy_pass http://nixo_origin;
    proxy_cache nixo_cdn;
    proxy_cache_valid 200 1d;
    add_header Cache-Control "public, max-age=86400, immutable";
  }

  location /api/chats { proxy_pass http://nixo_origin; add_header Cache-Control "private, no-store"; }
  location /api/ai { limit_req zone=nixo_ai burst=8 nodelay; proxy_pass http://nixo_origin; add_header Cache-Control "private, no-store"; }
  location /api/billing { limit_req zone=nixo_pay burst=4 nodelay; proxy_pass http://nixo_origin; add_header Cache-Control "private, no-store"; }
  location /api/search { limit_req zone=nixo_search burst=10 nodelay; proxy_pass http://nixo_origin; add_header Cache-Control "private, no-store"; }
  location /api/register { limit_req zone=nixo_auth burst=4 nodelay; proxy_pass http://nixo_origin; add_header Cache-Control "private, no-store"; }
  location /api/storage { limit_req zone=nixo_dl burst=8 nodelay; proxy_pass http://nixo_origin; add_header Cache-Control "private, no-store"; proxy_set_header Range $http_range; }

  location /api/chats/ {
    proxy_pass http://nixo_origin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-cache, no-transform";
  }

  location / {
    proxy_pass http://nixo_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_hide_header X-Powered-By;
  }
}
