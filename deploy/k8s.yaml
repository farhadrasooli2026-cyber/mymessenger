apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixo
  labels:
    app: nixo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nixo
  template:
    metadata:
      labels:
        app: nixo
    spec:
      terminationGracePeriodSeconds: 12
      containers:
        - name: nixo
          image: nixo:0.1.0
          ports:
            - containerPort: 43151
          envFrom:
            - secretRef:
                name: nixo-runtime
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health?probe=ready
              port: 43151
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health?probe=live
              port: 43151
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: nixo
spec:
  selector:
    app: nixo
  ports:
    - port: 80
      targetPort: 43151
