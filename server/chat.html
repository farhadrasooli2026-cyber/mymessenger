<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیام‌رسان من - چت</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f0f2f5; }
    
    /* sidebar */
    .sidebar { width: 30%; background: #ffffff; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; background: #0088cc; color: #fff; font-weight: bold; text-align: center; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .user-item:hover { background-color: #f5f5f5; }
    .user-item.active { background-color: #e6f2ff; }

    /* chat area */
    .chat-area { width: 70%; display: flex; flex-direction: column; background: #e5ddd5; }
    .chat-header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #ccc; display: flex; flex-direction: column; }
    .chat-title { font-weight: bold; font-size: 16px; }
    .chat-status { font-size: 12px; color: #666; margin-top: 3px; }
    
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .message { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .message.sent { align-self: flex-start; background: #dcf8c6; }
    .message.received { align-self: flex-end; background: #ffffff; }

    .input-area { padding: 10px; background: #fff; display: flex; align-items: center; gap: 8px; }
    .input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .send-btn { padding: 8px 18px; background: #0088cc; color: white; border: none; border-radius: 20px; cursor: pointer; }
    .send-btn:hover { background: #006699; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header" id="myUsernameDisplay">چت‌ها</div>
    <div class="user-list" id="userList"></div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-title" id="activeChatTitle">کاربری را انتخاب کنید</div>
      <div class="chat-status" id="activeChatStatus"></div>
    </div>

    <div class="messages-container" id="messagesContainer"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="پیامی بنویسید..." disabled>
      <button class="send-btn" id="sendBtn" disabled>ارسال</button>
    </div>
  </div>

  <script>
    const socket = io();
    const currentUser = localStorage.getItem('username') || 'کاربر';
    let activeChatUser = null;

    document.getElementById('myUsernameDisplay').innerText = `حساب: ${currentUser}`;
    socket.emit('register_user', currentUser);

    // گرفتن لیست کاربران
    fetch('/api/users')
      .then(res => res.json())
      .then(users => {
        const userListEl = document.getElementById('userList');
        userListEl.innerHTML = '';
        users.forEach(user => {
          if (user.username !== currentUser) {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerText = user.username;
            div.onclick = () => selectUser(user.username, div);
            userListEl.appendChild(div);
          }
        });
      }).catch(() => {});

    function selectUser(username, element) {
      activeChatUser = username;
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      document.getElementById('activeChatTitle').innerText = username;
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;

      socket.emit('get_user_status', username);
    }

    socket.on('user_status_response', (data) => {
      if (data.username === activeChatUser) {
        updateStatusDisplay(data.status);
      }
    });

    socket.on('user_status_change', (data) => {
      if (data.username === activeChatUser) {
        updateStatusDisplay(data.status);
      }
    });

    function updateStatusDisplay(status) {
      const me = document.getElementById('activeChatStatus');
      if (status === 'online') {
        me.innerText = 'آنلاین';
        me.style.color = '#0088cc';
      } else {
        me.innerText = status;
        me.style.color = '#666';
      }
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      const data = {
        sender: currentUser,
        receiver: activeChatUser,
        message: text
      };

      socket.emit('send_private_message', data);
      appendMessage(data, 'sent');
      input.value = '';
    }

    socket.on('receive_private_message', (data) => {
      if (data.sender === activeChatUser) {
        appendMessage(data, 'received');
      }
    });

    function appendMessage(data, type) {
      const container = document.getElementById('messagesContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.innerText = data.message;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
