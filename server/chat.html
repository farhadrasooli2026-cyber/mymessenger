<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyMessenger - محیط گفتگو</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-image: url('male-bg.jpg');
            --primary: #0284c7;
            --sidebar-bg: rgba(0, 0, 0, 0.25);
            --chat-bg: transparent;
            --text-main: #ffffff;
            --msg-out: #0284c7;
            --msg-in: rgba(255, 255, 255, 0.9);
        }

        body.female-theme {
            --bg-image: url('female-bg.jpg');
            --primary: #e11d48;
            --sidebar-bg: rgba(0, 0, 0, 0.25);
            --chat-bg: transparent;
            --text-main: #ffffff;
            --msg-out: #e11d48;
            --msg-in: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        html, body { height: 100%; width: 100%; overflow: hidden; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 15px;
        }

        .chat-app {
            width: 100%;
            max-width: 1050px;
            height: 88vh;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .user-header {
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .username { font-weight: 700; color: var(--text-main); font-size: 15px; word-break: break-word; }
        .btn-logout { background: none; border: none; font-size: 20px; cursor: pointer; color: #ef4444; }

        .section-title { padding: 10px 14px 4px; font-size: 12px; color: rgba(255,255,255,0.7); font-weight: bold; }

        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { padding: 10px 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 6px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; }
        .chat-item:hover, .chat-item.active { background: rgba(0, 0, 0, 0.5); }
        
        .online-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #000; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); min-width: 0; }
        .chat-header { padding: 16px 20px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-weight: bold; color: var(--text-main); }

        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .message { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; box-shadow: 0 4px 15px rgba(0,0,0,0.2); word-wrap: break-word; }
        .message.outgoing { background: var(--msg-out); color: #fff; align-self: flex-start; border-top-right-radius: 4px; }
        .message.incoming { background: var(--msg-in); color: #0f172a; align-self: flex-end; border-top-left-radius: 4px; }
        .message-sender { font-size: 11px; margin-bottom: 4px; opacity: 0.8; font-weight: bold; }

        .input-area { padding: 14px 16px; background: rgba(0, 0, 0, 0.25); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 10px; align-items: center; }
        .msg-input { flex: 1; padding: 12px 18px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.9); border-radius: 20px; outline: none; font-size: 14px; width: 100%; color: #0f172a; }
        .msg-input:focus { background: #ffffff; border-color: var(--primary); }
        .btn-send { background: var(--primary); color: #fff; border: none; padding: 12px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        @media (max-width: 768px) {
            body { padding: 0; }
            .chat-app { height: 100vh; height: 100dvh; border-radius: 0; border: none; }
            .sidebar { width: 70px; }
            .username, .chat-item div, .section-title { display: none; }
            .user-header { justify-content: center; flex-direction: column; gap: 10px; padding: 12px 5px; }
            .chat-item { justify-content: center; padding: 10px 0; }
            .message { max-width: 88%; }
            .input-area { padding: 10px; }
            .msg-input { padding: 10px 14px; font-size: 13px; }
            .btn-send { padding: 10px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="sidebar">
        <div class="user-header">
            <div class="user-info">
                <div class="avatar" id="userAvatar">U</div>
                <div class="username" id="displayUsername">کاربر</div>
            </div>
            <button class="btn-logout" onclick="logout()" title="خروج">🚪</button>
        </div>
        
        <div class="chat-list">
            <div class="section-title">اتاق‌ها</div>
            <div class="chat-item active">
                <div class="avatar">💬</div>
                <div>
                    <div style="font-weight: bold;">چت عمومی</div>
                    <div style="font-size: 11px; opacity: 0.8;">اتاق گفتگوی زنده</div>
                </div>
            </div>

            <div class="section-title">کاربران آنلاین (<span id="onlineCount">0</span>)</div>
            <div id="onlineUsersList"></div>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header" id="currentChatTitle">چت عمومی</div>
        
        <div class="messages-container" id="messagesBox"></div>

        <form class="input-area" onsubmit="sendMessage(event)">
            <input type="text" id="messageInput" class="msg-input" placeholder="پیام خود را بنویسید..." autocomplete="off">
            <button type="submit" class="btn-send">ارسال</button>
        </form>
    </div>
</div>

<script>
    let currentUser = null;
    try {
        currentUser = JSON.parse(localStorage.getItem('currentUser'));
    } catch(e) {}

    if (currentUser) {
        document.getElementById('displayUsername').innerText = currentUser.username || 'کاربر';
        document.getElementById('userAvatar').innerText = (currentUser.username || 'U').charAt(0).toUpperCase();

        if (currentUser.gender === 'female') {
            document.body.classList.add('female-theme');
        } else {
            document.body.classList.remove('female-theme');
        }
    }

    const socket = io();

    // اعلام ورود کاربر به سرور
    if (currentUser) {
        socket.emit('user_connected', currentUser);
    }

    // دریافت و رندر کاربران آنلاین
    socket.on('update_online_users', (users) => {
        const listContainer = document.getElementById('onlineUsersList');
        document.getElementById('onlineCount').innerText = users.length;
        listContainer.innerHTML = '';

        users.forEach(u => {
            if (currentUser && u.id === currentUser.id) return; // خودش را فرعی نمایش ندادن

            const item = document.createElement('div');
            item.className = 'chat-item';
            item.innerHTML = `
                <div class="avatar">
                    ${u.username.charAt(0).toUpperCase()}
                    <span class="online-dot"></span>
                </div>
                <div>
                    <div style="font-weight: bold; font-size: 13px;">${u.username}</div>
                    <div style="font-size: 11px; opacity: 0.7;">آنلاین</div>
                </div>
            `;
            listContainer.appendChild(item);
        });
    });

    socket.on('load_history', (messages) => {
        const msgBox = document.getElementById('messagesBox');
        msgBox.innerHTML = '';
        if (Array.isArray(messages)) {
            messages.forEach(msg => renderMessage(msg));
        }
        msgBox.scrollTop = msgBox.scrollHeight;
    });

    socket.on('receive_message', (msg) => {
        renderMessage(msg);
        const msgBox = document.getElementById('messagesBox');
        msgBox.scrollTop = msgBox.scrollHeight;
    });

    function renderMessage(msg) {
        const msgBox = document.getElementById('messagesBox');
        const msgDiv = document.createElement('div');
        const isSelf = currentUser && msg.sender_id === currentUser.id;
        
        msgDiv.className = `message ${isSelf ? 'outgoing' : 'incoming'}`;
        msgDiv.innerHTML = `
            ${!isSelf ? `<div class="message-sender">${msg.sender_name || 'کاربر'}</div>` : ''}
            <div>${msg.text}</div>
        `;
        msgBox.appendChild(msgDiv);
    }

    function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        
        if (text) {
            socket.emit('send_message', {
                senderId: currentUser ? currentUser.id : 'guest',
                senderName: currentUser ? currentUser.username : 'میهمان',
                text: text
            });
            input.value = '';
        }
    }

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
