<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMessenger - ورود و ثبت‌نام</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 30px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;
        }
        h2 { margin-bottom: 20px; font-size: 22px; }
        .input-group { margin-bottom: 14px; text-align: right; }
        .input-group input {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2); color: #fff; outline: none; font-size: 14px; text-align: right;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.7); }
        
        .gender-box { display: flex; gap: 10px; margin: 15px 0; }
        .gender-btn {
            flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .gender-btn.active-male { background: #0284c7; border-color: #38bdf8; }
        .gender-btn.active-female { background: #e11d48; border-color: #fb7185; }

        .btn-submit {
            width: 100%; padding: 12px; border-radius: 12px; border: none; background: #0284c7;
            color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .toggle-link { margin-top: 15px; font-size: 13px; color: #38bdf8; cursor: pointer; display: block; }
    </style>
</head>
<body>

<div class="card" id="formCard">
    <h2 id="formTitle">ورود به حساب</h2>
    
    <form id="authForm" onsubmit="handleSubmit(event)">
        <div class="input-group" id="usernameGroup" style="display: none;">
            <input type="text" id="regUsername" placeholder="نام کاربری">
        </div>
        
        <div class="input-group">
            <input type="text" id="loginIdentifier" placeholder="نام کاربری یا ایمیل" required>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="رمز عبور" required>
        </div>

        <div class="gender-box" id="genderBox" style="display: none;">
            <button type="button" class="gender-btn active-male" id="btnMale" onclick="setGender('male')">👨 مرد</button>
            <button type="button" class="gender-btn" id="btnFemale" onclick="setGender('female')">👩 زن</button>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">ورود</button>
    </form>

    <span class="toggle-link" id="toggleLink" onclick="toggleForm()">حساب کاربری ندارید؟ ثبت‌نام کنید</span>
</div>

<script>
    let isRegister = false;
    let selectedGender = 'male';

    function setGender(g) {
        selectedGender = g;
        document.getElementById('btnMale').className = `gender-btn ${g === 'male' ? 'active-male' : ''}`;
        document.getElementById('btnFemale').className = `gender-btn ${g === 'female' ? 'active-female' : ''}`;
    }

    function toggleForm() {
        isRegister = !isRegister;
        document.getElementById('formTitle').innerText = isRegister ? 'ساخت حساب جدید' : 'ورود به حساب';
        document.getElementById('usernameGroup').style.display = isRegister ? 'block' : 'none';
        document.getElementById('genderBox').style.display = isRegister ? 'flex' : 'none';
        document.getElementById('submitBtn').innerText = isRegister ? 'ثبت‌نام' : 'ورود';
        document.getElementById('toggleLink').innerText = isRegister ? 'قبلاً حساب دارید؟ ورود به حساب' : 'حساب کاربری ندارید؟ ثبت‌نام کنید';
        document.getElementById('loginIdentifier').placeholder = isRegister ? 'ایمیل' : 'نام کاربری یا ایمیل';
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const identifier = document.getElementById('loginIdentifier').value;

        if (isRegister) {
            const username = document.getElementById('regUsername').value || identifier;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email: identifier, password, gender: selectedGender })
            });
            const data = await res.json();
            if (data.success) {
                alert('ثبت‌نام با موفقیت انجام شد! وارد شوید.');
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location.href = 'chat.html';
            } else {
                alert(data.message || 'خطا در ثبت‌نام');
            }
        } else {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location.href = 'chat.html';
            } else {
                alert(data.message || 'نام کاربری یا رمز عبور اشتباه است.');
            }
        }
    }
</script>
</body>
</html>
