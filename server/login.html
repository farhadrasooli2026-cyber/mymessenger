<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMessenger - ورود به حساب</title>
    <style>
        :root {
            --bg-image: url('female-bg.jpg');
            --primary: #e11d48;
            --primary-hover: #be123c;
            --text-main: #4c0519;
            --text-muted: #9f1239;
            --input-border: #fda4af;
            --input-focus: #f43f5e;
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: all 0.3s ease; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px 15px;
        }

        .container { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            width: 100%; 
            max-width: 420px; 
            border-radius: 36px; 
            padding: 35px 25px; 
            box-shadow: var(--card-shadow); 
            border: 2px solid rgba(255, 255, 255, 0.6); 
            text-align: center; 
        }

        .brand-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
        .brand-title { color: var(--primary); font-size: 36px; font-weight: 800; direction: ltr; }
        .brand-icon { font-size: 30px; }
        .brand-subtitle { color: var(--text-muted); font-size: 15px; font-weight: 600; margin-bottom: 24px; }
        .section-title { color: var(--text-main); font-size: 26px; font-weight: 800; margin-bottom: 24px; }
        
        .form-group { margin-bottom: 14px; } 
        .input-box { 
            width: 100%; 
            padding: 16px 20px; 
            border: 2px solid var(--input-border); 
            border-radius: 20px; 
            font-size: 15px; 
            outline: none; 
            background: rgba(255, 255, 255, 0.9); 
            color: #333; 
            text-align: right; 
        } 
        .input-box:focus { border-color: var(--input-focus); box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15); }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .btn-submit:hover { background: var(--primary-hover); }

        .footer-text { margin-top: 20px; color: var(--text-muted); font-size: 14px; }
        .footer-link { color: var(--primary); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <span class="brand-title">MyMessenger</span>
        <span class="brand-icon">💬</span>
    </div>
    <div class="brand-subtitle">پیام‌رسان سریع و امن</div>

    <h2 class="section-title">ورود به حساب</h2>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <input type="text" id="username" class="input-box" placeholder="نام کاربری یا ایمیل" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" class="input-box" placeholder="رمز عبور" required>
        </div>

        <button type="submit" class="btn-submit">ورود</button>
    </form>

    <div class="footer-text">
        حساب کاربری ندارید؟ <a href="index.html" class="footer-link">ثبت‌نام کنید</a>
    </div>
</div>

<script>
    async function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                alert(data.message);
                window.location.href = 'chat.html';
            } else {
                alert('خطا: ' + data.message);
            }
        } catch (error) {
            alert('ارتباط با سرور برقرار نشد!');
        }
    }
</script>

</body>
</html>
