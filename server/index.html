<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>MyMessenger</title> </head> <body> <h1>MyMessenger</h1> <input id="messageInput" type="text" placeholder="Type a message..."> <button id="sendButton">Send</button> <ul id="messages"></ul> <script src="/socket.io/socket.io.js"></script> <script> const socket = io(); const input = document.getElementById("messageInput"); const button = document.getElementById("sendButton"); const messages = document.getElementById("messages"); button.addEventListener("click", () => { const message = input.value.trim(); if (message === "") { return; } socket.emit("message", message); input.value = ""; }); socket.on("message", (message) => { const li = document.createElement("li"); li.textContent = message; messages.appendChild(li); }); </script> </body> </html>
