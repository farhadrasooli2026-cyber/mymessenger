<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تکمیل پروفایل | MyMessenger</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background-color: #ffe6e8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 30px 25px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
    h2 { color: #d81b60; margin-bottom: 20px; font-size: 22px; }
    .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #e91e63; background: #fdf8f9; margin-bottom: 16px; }
    .avatar-options { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .avatar-choice { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid transparent; }
    .avatar-choice.selected { border-color: #e91e63; }
    textarea { width: 100%; padding: 12px 15px; margin: 8px 0 15px; border: 1px solid #f3c2d3; border-radius: 10px; outline: none; background: #fdf8f9; font-size: 14px; resize: none; height: 90px; }
    .file-upload-btn { display: block; margin-bottom: 15px; font-size: 13px; color: #e91e63; cursor: pointer; font-weight: bold; }
    .btn { width: 100%; padding: 12px; background: #e91e63; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .btn.secondary { background: #888; margin-top: 10px; }
    .error { color: #c62828; font-size: 13px; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
<div class="card">
  <h2>تکمیل اطلاعات پروفایل</h2>
  <img id="previewImg" src="/girl.svg" alt="پروفایل" class="avatar-preview">
  <div class="avatar-options">
    <img src="/girl.svg" class="avatar-choice selected" data-src="/girl.svg" alt="زن">
    <img src="/boy.svg" class="avatar-choice" data-src="/boy.svg" alt="مرد">
  </div>
  <label class="file-upload-btn">
    آپلود عکس از دستگاه
    <input type="file" id="uploadFile" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none">
  </label>
  <textarea id="bioInput" maxlength="280" placeholder="بیوگرافی خود را بنویسید...">سلام! من از MyMessenger استفاده می‌کنم.</textarea>
  <button type="button" class="btn" id="saveBtn">ذخیره و ورود به چت</button>
  <button type="button" class="btn secondary" id="skipBtn">رفتن به چت</button>
  <div class="error" id="formError"></div>
</div>
<script src="/js/api.js"></script>
<script>
  let currentProfilePic = '/girl.svg';
  const formError = document.getElementById('formError');

  function selectAvatar(src) {
    currentProfilePic = src;
    document.getElementById('previewImg').src = src;
    document.querySelectorAll('.avatar-choice').forEach((img) => {
      img.classList.toggle('selected', img.getAttribute('data-src') === src);
    });
  }

  document.querySelectorAll('.avatar-choice').forEach((img) => {
    img.onclick = () => selectAvatar(img.getAttribute('data-src'));
  });

  (async () => {
    try {
      const data = await api('/api/me');
      const user = data.user;
      if (user.gender === 'مرد') selectAvatar('/boy.svg');
      if (user.profilePic) selectAvatar(user.profilePic);
      if (user.bio) document.getElementById('bioInput').value = user.bio;
    } catch (_e) {
      window.location.href = '/login.html';
    }
  })();

  document.getElementById('uploadFile').onchange = async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    formError.textContent = '';
    const body = new FormData();
    body.append('file', file);
    try {
      const data = await api('/api/upload', { method: 'POST', body });
      selectAvatar(data.url);
    } catch (err) {
      formError.textContent = err.message;
    }
  };

  async function saveProfile(goChat) {
    formError.textContent = '';
    try {
      await api('/api/update-profile', {
        method: 'POST',
        body: {
          profilePic: currentProfilePic,
          bio: document.getElementById('bioInput').value.trim(),
        },
      });
      if (goChat) window.location.href = '/chat.html';
    } catch (err) {
      formError.textContent = err.message;
    }
  }

  document.getElementById('saveBtn').onclick = () => saveProfile(true);
  document.getElementById('skipBtn').onclick = () => { window.location.href = '/chat.html'; };
</script>
</body>
</html>
