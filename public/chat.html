<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت روم | MyMessenger</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            display: flex;
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* لیست کاربران */
        .sidebar {
            width: 30%;
            background: #f8f9fa;
            border-left: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            background: #e91e63;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .user-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-item:hover, .user-item.active {
            background: #ffe6e8;
        }

        /* بخش گفتگو */
        .main-chat {
            width: 70%;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            color: #333;
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.sent {
            align-self: flex-start;
            background: #e91e63;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            align-self: flex-end;
            background: #e4e6eb;
            color: #050505;
            border-bottom-left-radius: 2px;
        }

        .input-box {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .input-box input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .input-box button {
            padding: 10px 20px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #fff;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- منوی سمت راست: لیست کاربران -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span id="myUsername">کاربر</span>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
        <ul class="user-list" id="usersList">
            <!-- کاربران اینجا اضافه می‌شوند -->
        </ul>
    </div>

    <!-- بخش اصلی چت -->
    <div class="main-chat">
        <div class="chat-header" id="selectedUserHeader">
            لطفا یک کاربر را برای گفتگو انتخاب کنید
        </div>
        <div class="messages-box" id="messagesBox">
            <!-- پیام‌ها اینجا نشان داده می‌شوند -->
        </div>
        <form class="input-box" id="messageForm">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." disabled required>
            <button type="submit" id="sendBtn" disabled>ارسال</button>
        </form>
    </div>
</div>

<script>
    // ۱. بررسی ورود کاربر (بدون بیرون انداختن اشتباه)
    const userRaw = localStorage.getItem('user');
    if (!userRaw) {
        window.location.href = '/login.html';
    }

    const currentUser = JSON.parse(userRaw);
    if (!currentUser || !currentUser.username) {
        window.location.href = '/login.html';
    }

    document.getElementById('myUsername').innerText = currentUser.username;

    const socket = io();
    let activeChatUser = null;

    // ثبت کاربر در سوکت
    socket.emit('register_user', currentUser.username);

    // ۲. دریافت لیست کاربران
    async function loadUsers() {
        try {
            const res = await fetch('/api/users');
            const users = await res.json();
            const list = document.getElementById('usersList');
            list.innerHTML = '';

            users.forEach(u => {
                if (u.username !== currentUser.username) {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    li.innerHTML = `<span>${u.gender === 'مرد' ? '👨' : '👩'}</span> <span>${u.username}</span>`;
                    li.onclick = () => selectUser(u.username, li);
                    list.appendChild(li);
                }
            });
        } catch (err) {
            console.error('خطا در دریافت لیست کاربران:', err);
        }
    }

    // ۳. انتخاب کاربر برای چت
    async function selectUser(username, element) {
        activeChatUser = username;
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        document.getElementById('selectedUserHeader').innerText = `گفتگو با ${username}`;
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;

        loadMessages();
    }

    // ۴. بارگذاری پیام‌های قبلی
    async function loadMessages() {
        if (!activeChatUser) return;
        try {
            const res = await fetch(`/api/messages/${currentUser.username}/${activeChatUser}`);
            const messages = await res.json();
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            messages.forEach(msg => {
                appendMessage(msg.sender, msg.message);
            });
            box.scrollTop = box.scrollHeight;
        } catch (err) {
            console.error('خطا در بارگذاری پیام‌ها:', err);
        }
    }

    // نمایش پیام در صفحه
    function appendMessage(sender, text) {
        const box = document.getElementById('messagesBox');
        const div = document.createElement('div');
        div.className = `message ${sender === currentUser.username ? 'sent' : 'received'}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // ۵. ارسال پیام
    document.getElementById('messageForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (message && activeChatUser) {
            socket.emit('send_private_message', {
                sender: currentUser.username,
                receiver: activeChatUser,
                message: message
            });
            input.value = '';
        }
    });

    // دریافت پیام زنده
    socket.on('receive_private_message', (data) => {
        if (data.sender === activeChatUser) {
            appendMessage(data.sender, data.message);
        }
    });

    socket.on('message_sent', (data) => {
        if (data.receiver === activeChatUser) {
            appendMessage(data.sender, data.message);
        }
    });

    // خروج
    function logout() {
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    loadUsers();
</script>

</body>
</html>
