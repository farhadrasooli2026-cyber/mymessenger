<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت روم | MyMessenger</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        /* بک‌گراند اصلی کل صفحه */
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1518655048521-f130df041f66?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        /* باکس اصلی چت شیشه‌ای (Glassmorphism) */
        .chat-container { 
            display: flex; 
            width: 90%; 
            max-width: 1000px; 
            height: 85vh; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px);
            border-radius: 15px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
            overflow: hidden; 
        }
        
        .sidebar { width: 35%; background: rgba(248, 249, 250, 0.7); border-left: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #e91e63; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .user-list { list-style: none; overflow-y: auto; flex: 1; }
        .user-item { padding: 12px 15px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .user-item:hover, .user-item.active { background: rgba(233, 30, 99, 0.15); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .unread-badge { background-color: #e91e63; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; font-weight: bold; display: none; }

        .main-chat { width: 65%; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.4); }
        .chat-header { padding: 12px 15px; background: rgba(255, 255, 255, 0.8); border-bottom: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .chat-header-name { font-weight: bold; color: #333; font-size: 16px; }
        .chat-header-status { font-size: 12px; color: #2e7d32; margin-top: 2px; }
        
        /* باکس پیام‌ها نیمه‌شفاف جهت مشخص بودن بک‌گراند */
        .messages-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            background: rgba(255, 255, 255, 0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        .message { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; display: block; }
        .message .caption { margin-top: 5px; font-size: 13px; }
        .message.sent { align-self: flex-start; background: #e91e63; color: white; border-bottom-right-radius: 2px; }
        .message.received { align-self: flex-end; background: #ffffff; color: #050505; border-bottom-left-radius: 2px; }
        
        .input-box { padding: 15px; display: flex; gap: 10px; background: rgba(255, 255, 255, 0.8); border-top: 1px solid rgba(0,0,0,0.08); align-items: center; }
        .input-box input[type="text"] { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; background: #fff; }
        .input-box button { padding: 10px 20px; background: #e91e63; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .attach-btn { background: #fff; border: 1px solid #ddd; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
        .attach-btn:hover { background: #f0f2f5; }
        #imageInput { display: none; }

        .logout-btn { background: transparent; border: 1px solid #fff; color: white; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        .image-modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        .image-modal img { max-width: 90%; max-height: 90%; border-radius: 10px; }
        .image-modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 35px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <span id="myUsername">کاربر</span>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
        <ul class="user-list" id="usersList"></ul>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="chat-header-name" id="selectedUserHeader">لطفا یک کاربر را انتخاب کنید</div>
            <div class="chat-header-status" id="selectedUserStatus"></div>
        </div>
        <div class="messages-box" id="messagesBox"></div>
        
        <form class="input-box" id="messageForm">
            <label for="imageInput" class="attach-btn" title="ارسال عکس">📎</label>
            <input type="file" id="imageInput" accept="image/*" disabled onchange="handleImageUpload(this)">
            
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." disabled required>
            <button type="submit" id="sendBtn" disabled>ارسال</button>
        </form>
    </div>
</div>

<div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <span class="image-modal-close">&times;</span>
    <img id="modalImage" src="">
</div>

<script>
    const userRaw = localStorage.getItem('user');
    if (!userRaw) window.location.href = '/login.html';

    const currentUser = JSON.parse(userRaw);
    if (!currentUser || !currentUser.username) window.location.href = '/login.html';

    document.getElementById('myUsername').innerText = currentUser.username;

    const socket = io();
    let activeChatUser = null;
    const unreadCounts = {};

    socket.emit('register_user', currentUser.username);

    function playBeepSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } catch (e) {}
    }

    async function loadUsers() {
        try {
            const res = await fetch('/api/users');
            const users = await res.json();
            const list = document.getElementById('usersList');
            list.innerHTML = '';

            users.forEach(u => {
                if (u.username !== currentUser.username) {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    li.id = `user-item-${u.username}`;
                    
                    const count = unreadCounts[u.username] || 0;

                    li.innerHTML = `
                        <div class="user-info">
                            <span>${u.gender === 'مرد' ? '👨' : '👩'}</span>
                            <span>${u.username}</span>
                        </div>
                        <span class="unread-badge" id="badge-${u.username}" style="display: ${count > 0 ? 'inline-block' : 'none'}">${count}</span>
                    `;
                    li.onclick = () => selectUser(u.username, li);
                    list.appendChild(li);
                }
            });
        } catch (err) { console.error(err); }
    }

    async function selectUser(username, element) {
        activeChatUser = username;
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        unreadCounts[username] = 0;
        const badge = document.getElementById(`badge-${username}`);
        if (badge) {
            badge.innerText = '0';
            badge.style.display = 'none';
        }

        document.getElementById('selectedUserHeader').innerText = `گفتگو با ${username}`;
        document.getElementById('selectedUserStatus').innerText = '🟢 آنلاین';
        
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('imageInput').disabled = false;

        loadMessages();
    }

    async function loadMessages() {
        if (!activeChatUser) return;
        try {
            const res = await fetch(`/api/messages/${currentUser.username}/${activeChatUser}`);
            const messages = await res.json();
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            messages.forEach(msg => appendMessage(msg.sender, msg.message));
            box.scrollTop = box.scrollHeight;
        } catch (err) { console.error(err); }
    }

    function appendMessage(sender, text) {
        const box = document.getElementById('messagesBox');
        const div = document.createElement('div');
        div.className = `message ${sender === currentUser.username ? 'sent' : 'received'}`;
        
        if (text.startsWith('data:image')) {
            const parts = text.split('||caption||');
            const imgUrl = parts[0];
            const captionText = parts[1] || '';

            let html = `<img src="${imgUrl}" onclick="openImageModal('${imgUrl}')" alt="تصویر">`;
            if (captionText) {
                html += `<div class="caption">${captionText}</div>`;
            }
            div.innerHTML = html;
        } else {
            div.innerText = text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('messageForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (message && activeChatUser) {
            socket.emit('send_private_message', {
                sender: currentUser.username,
                receiver: activeChatUser,
                message: message
            });
            input.value = '';
        }
    });

    function handleImageUpload(input) {
        const file = input.files[0];
        if (file && activeChatUser) {
            const caption = prompt("توضیحات عکس (کپشن) را وارد کنید (اختیاری):") || "";
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result + '||caption||' + caption;
                socket.emit('send_private_message', {
                    sender: currentUser.username,
                    receiver: activeChatUser,
                    message: base64Data
                });
            };
            reader.readAsDataURL(file);
            input.value = '';
        }
    }

    function openImageModal(src) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        modal.style.display = 'flex';
        modalImg.src = src;
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    socket.on('receive_private_message', (data) => {
        playBeepSound();
        if (data.sender === activeChatUser) {
            appendMessage(data.sender, data.message);
        } else {
            unreadCounts[data.sender] = (unreadCounts[data.sender] || 0) + 1;
            const badge = document.getElementById(`badge-${data.sender}`);
            if (badge) {
                badge.innerText = unreadCounts[data.sender];
                badge.style.display = 'inline-block';
            }
        }
    });

    socket.on('message_sent', (data) => {
        if (data.receiver === activeChatUser) appendMessage(data.sender, data.message);
    });

    function logout() {
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    loadUsers();
</script>

</body>
</html>
