<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>چت | MyMessenger</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    body.theme-female { background-image: url('/girl.svg'); }
    body.theme-male { background-image: url('/boy.svg'); }
    .app-container {
      display: flex; width: 95%; max-width: 1100px; height: 90vh;
      background: rgba(0, 0, 0, 0.28); border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .sidebar { width: 300px; border-left: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; background: rgba(0,0,0,0.35); }
    .sidebar-header { padding: 14px 16px; color: #fff; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.15); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .me-name { font-weight: bold; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; }
    .tiny-btn { background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
    .search-box { padding: 10px 12px; }
    .search-box input { width: 100%; border: none; border-radius: 16px; padding: 8px 12px; outline: none; }
    .user-item { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; gap: 10px; color: #f0f0f0; }
    .user-item:hover, .user-item.active { background: rgba(214, 51, 132, 0.5); }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #444; flex-shrink: 0; }
    .user-meta { flex: 1; min-width: 0; }
    .user-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .user-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-online { background: #2ecc71; }
    .dot-offline { background: #e74c3c; }
    .unread { background: #d63384; color: #fff; border-radius: 10px; min-width: 18px; height: 18px; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: transparent; min-width: 0; }
    .chat-header { padding: 14px 16px; background: rgba(0,0,0,0.45); color: #fff; border-bottom: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: space-between; }
    .chat-header-info { display: flex; flex-direction: column; }
    .chat-header-status { font-size: 11px; color: #ccc; font-weight: normal; margin-top: 2px; }
    .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; word-break: break-word; font-size: 14px; line-height: 1.4; }
    .message.sent { align-self: flex-start; background: #d63384; color: #fff; border-bottom-left-radius: 4px; }
    .message.received { align-self: flex-end; background: rgba(255,255,255,0.92); color: #111; border-bottom-right-radius: 4px; }
    .message img { max-width: 100%; border-radius: 10px; cursor: pointer; margin-bottom: 5px; display: block; }
    .message audio { width: 220px; max-width: 100%; outline: none; }
    .msg-time { font-size: 10px; opacity: 0.75; margin-top: 4px; }
    .input-area { padding: 10px 14px; background: rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,0.15); }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; outline: none; background: rgba(255,255,255,0.9); font-size: 14px; }
    .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #fff; padding: 0; line-height: 1; }
    .action-btn.recording { color: #e74c3c; }
    .send-btn { background: #d63384; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .image-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
    .image-modal img { max-width: 95%; max-height: 85vh; border-radius: 8px; }
    .back-btn { display: none; background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 5px 12px; border-radius: 12px; cursor: pointer; font-size: 12px; }
    .preview-bar { display: none; padding: 8px 14px; background: rgba(0,0,0,0.45); color: #fff; font-size: 12px; align-items: center; gap: 10px; }
    .preview-bar.show { display: flex; }
    .preview-bar img { height: 48px; border-radius: 8px; }
    .conn { font-size: 11px; color: #ccc; }
    .conn.bad { color: #ff8a80; }
    @media (max-width: 768px) {
      .app-container { width: 100%; height: 100vh; border-radius: 0; border: none; }
      .sidebar { width: 100%; height: 100%; border-left: none; }
      .chat-area { display: none; width: 100%; height: 100%; }
      .app-container.chat-open .sidebar { display: none; }
      .app-container.chat-open .chat-area { display: flex; }
      .back-btn { display: inline-block; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>
  <div class="app-container" id="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="me-name" id="me-name">...</span>
        <div class="header-actions">
          <button class="tiny-btn" id="profile-btn">پروفایل</button>
          <button class="tiny-btn" id="logout-btn">خروج</button>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="user-search" placeholder="جستجوی مخاطب...">
      </div>
      <div id="users-list" style="overflow-y: auto; flex: 1;"></div>
    </div>
    <div class="chat-area">
      <div class="chat-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="back-btn" id="back-btn">بازگشت</button>
          <div class="chat-header-info">
            <span id="chat-header-title">یک مخاطب را انتخاب کنید</span>
            <span id="chat-header-status" class="chat-header-status"></span>
          </div>
        </div>
        <span class="conn" id="conn-status">آنلاین</span>
      </div>
      <div class="messages-container" id="messages-container"></div>
      <div class="preview-bar" id="preview-bar">
        <img id="preview-thumb" alt="">
        <span>عکس آماده ارسال است. کپشن بنویسید یا ارسال را بزنید.</span>
        <button class="tiny-btn" id="clear-preview">حذف</button>
      </div>
      <div class="input-area">
        <label class="action-btn" title="ارسال عکس">📎
          <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none">
        </label>
        <button id="mic-btn" class="action-btn" title="ضبط صدا">🎤</button>
        <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." maxlength="4000" autocomplete="off">
        <button class="send-btn" id="send-btn">ارسال</button>
      </div>
    </div>
  </div>
  <div class="image-modal" id="image-modal">
    <img id="full-image" alt="">
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/wav.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
