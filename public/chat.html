<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چت روم | MyMessenger</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: #1a1a1a;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .chat-container { 
            display: flex; 
            width: 90%; 
            max-width: 1000px; 
            height: 85vh; 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 15px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden; 
        }
        
        .sidebar { width: 35%; background: rgba(0, 0, 0, 0.3); border-left: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: rgba(233, 30, 99, 0.85); color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .user-list { list-style: none; overflow-y: auto; flex: 1; }
        .user-item { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.15); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; color: #fff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .user-item:hover, .user-item.active { background: rgba(233, 30, 99, 0.4); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .unread-badge { background-color: #e91e63; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; font-weight: bold; display: none; }

        .main-chat { width: 65%; display: flex; flex-direction: column; background: transparent; }
        .chat-header { padding: 12px 15px; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; flex-direction: column; }
        .chat-header-name { font-weight: bold; color: #fff; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .chat-header-status { font-size: 12px; color: #00ff66; font-weight: bold; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .back-btn { display: none; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        .messages-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            background: transparent; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        .message { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .message img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; cursor: pointer; display: block; object-fit: cover; }
        .message audio { max-width: 100%; margin-top: 5px; outline: none; }
        .message .caption { margin-top: 5px; font-size: 13px; font-weight: normal; }
        .message.sent { align-self: flex-start; background: rgba(233, 30, 99, 0.9); color: white; border-bottom-right-radius: 2px; }
        .message.received { align-self: flex-end; background: rgba(255, 255, 255, 0.95); color: #050505; border-bottom-left-radius: 2px; }
        
        .input-box { padding: 15px; display: flex; gap: 10px; background: rgba(0, 0, 0, 0.4); border-top: 1px solid rgba(255,255,255,0.2); align-items: center; }
        .input-box input[type="text"] { flex: 1; padding: 10px 15px; border: 1px solid rgba(255,255,255,0.5); border-radius: 20px; outline: none; background: rgba(255, 255, 255, 0.9); font-size: 16px; }
        .input-box button { padding: 10px 20px; background: #e91e63; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .attach-btn, .record-btn { background: rgba(255, 255, 255, 0.9); border: 1px solid #ddd; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; user-select: none; }
        .attach-btn:hover, .record-btn:hover { background: #fff; }
        .record-btn.recording { background: #ff4d4d; color: white; animation: pulse 1.5s infinite; }
        #imageInput { display: none; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .logout-btn { background: rgba(0,0,0,0.3); border: 1px solid #fff; color: white; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        .image-modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        .image-modal img { max-width: 90%; max-height: 90%; border-radius: 10px; }
        .image-modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 35px; cursor: pointer; }

        @media (max-width: 768px) {
            .chat-container { width: 100%; height: 100vh; border-radius: 0; border: none; }
            .sidebar { width: 100%; display: flex; }
            .main-chat { width: 100%; display: none; }
            .chat-container.mobile-chat-open .sidebar { display: none; }
            .chat-container.mobile-chat-open .main-chat { display: flex; }
            .back-btn { display: block; }
        }
    </style>
</head>
<body>

<div class="chat-container" id="chatContainer">
    <div class="sidebar">
        <div class="sidebar-header">
            <span id="myUsername">کاربر</span>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
        <ul class="user-list" id="usersList"></ul>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-header-name" id="selectedUserHeader">لطفا یک کاربر را انتخاب کنید</div>
                <div class="chat-header-status" id="selectedUserStatus"></div>
            </div>
            <button class="back-btn" onclick="closeMobileChat()">بازگشت 🔙</button>
        </div>
        <div class="messages-box" id="messagesBox"></div>
        
        <form class="input-box" id="messageForm">
            <label for="imageInput" class="attach-btn" title="ارسال عکس">📎</label>
            <input type="file" id="imageInput" accept="image/*" disabled onchange="handleImageUpload(this)">
            
            <div type="button" id="recordBtn" class="record-btn" title="ضبط و ارسال صدا (کلیک برای شروع/توقف)" onclick="toggleRecording()" style="opacity: 0.6; pointer-events: none;">🎤</div>

            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." disabled>
            <button type="submit" id="sendBtn" disabled>ارسال</button>
        </form>
    </div>
</div>

<div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <span class="image-modal-close">&times;</span>
    <img id="modalImage" src="">
</div>

<script>
    const userRaw = localStorage.getItem('user');
    if (!userRaw) {
        window.location.href = '/login.html';
    }

    const currentUser = JSON.parse(userRaw);
    if (!currentUser || !currentUser.username) {
        window.location.href = '/login.html';
    }

    if (currentUser.gender === 'زن' || currentUser.gender === 'دختر') {
        document.body.style.backgroundImage = "url('/girl.jpg')";
    } else {
        document.body.style.backgroundImage = "url('/boy.jpg')";
    }

    document.getElementById('myUsername').innerText = currentUser.username;

    const socket = io();
    let activeChatUser = null;
    const unreadCounts = {};

    socket.emit('register_user', currentUser.username);

    function playBeepSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } catch (e) {}
    }

    async function loadUsers() {
        try {
            const res = await fetch('/api/users');
            const users = await res.json();
            const list = document.getElementById('usersList');
            list.innerHTML = '';

            users.forEach(u => {
                if (u.username !== currentUser.username) {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    li.id = `user-item-${u.username}`;
                    
                    const count = unreadCounts[u.username] || 0;

                    li.innerHTML = `
                        <div class="user-info">
                            <span>${u.gender === 'مرد' ? '👨' : '👩'}</span>
                            <span>${u.username}</span>
                        </div>
                        <span class="unread-badge" id="badge-${u.username}" style="display: ${count > 0 ? 'inline-block' : 'none'}">${count}</span>
                    `;
                    li.onclick = () => selectUser(u.username, li);
                    list.appendChild(li);
                }
            });
        } catch (err) { console.error(err); }
    }

    async function selectUser(username, element) {
        activeChatUser = username;
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        unreadCounts[username] = 0;
        const badge = document.getElementById(`badge-${username}`);
        if (badge) {
            badge.innerText = '0';
            badge.style.display = 'none';
        }

        document.getElementById('selectedUserHeader').innerText = `گفتگو با ${username}`;
        document.getElementById('selectedUserStatus').innerText = '🟢 آنلاین';
        
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('imageInput').disabled = false;
        
        const recBtn = document.getElementById('recordBtn');
        recBtn.style.opacity = '1';
        recBtn.style.pointerEvents = 'auto';

        document.getElementById('chatContainer').classList.add('mobile-chat-open');

        loadMessages();
    }

    function closeMobileChat() {
        document.getElementById('chatContainer').classList.remove('mobile-chat-open');
    }

    async function loadMessages() {
        if (!activeChatUser) return;
        try {
            const res = await fetch(`/api/messages/${currentUser.username}/${activeChatUser}`);
            const messages = await res.json();
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            messages.forEach(msg => appendMessage(msg.sender, msg.message));
            box.scrollTop = box.scrollHeight;
        } catch (err) { console.error(err); }
    }

    function appendMessage(sender, text) {
        const box = document.getElementById('messagesBox');
        const div = document.createElement('div');
        div.className = `message ${sender === currentUser.username ? 'sent' : 'received'}`;
        
        if (text && text.includes('||caption||')) {
            const firstIndex = text.indexOf('||caption||');
            const imgUrl = text.substring(0, firstIndex);
            const captionText = text.substring(firstIndex + 11);

            const img = document.createElement('img');
            img.src = imgUrl;
            img.onclick = () => openImageModal(imgUrl);
            div.appendChild(img);

            if (captionText) {
                const capDiv = document.createElement('div');
                capDiv.className = 'caption';
                capDiv.innerText = captionText;
                div.appendChild(capDiv);
            }
        } else if (text && text.startsWith('data:image')) {
            const img = document.createElement('img');
            img.src = text;
            img.onclick = () => openImageModal(text);
            div.appendChild(img);
        } else if (text && text.startsWith('data:audio')) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = text;
            div.appendChild(audio);
        } else {
            div.innerText = text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // بخش ضبط صدا
    let mediaRecorder;
    let audioChunks = [];

    async function toggleRecording() {
        const recordBtn = document.getElementById('recordBtn');

        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        if (activeChatUser) {
                            socket.emit('send_private_message', {
                                sender: currentUser.username,
                                receiver: activeChatUser,
                                message: base64Audio
                            });
                        }
                    };
                    reader.readAsDataURL(audioBlob);
                    
                    // بستن استریم میکروفون
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                recordBtn.classList.add('recording');
            } catch (err) {
                alert('امکان دسترسی به میکروفون وجود ندارد یا مرورگر شما پشتیبانی نمی‌کند.');
            }
        } else if (mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            recordBtn.classList.remove('recording');
        }
    }

    document.getElementById('messageForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (message && activeChatUser) {
            socket.emit('send_private_message', {
                sender: currentUser.username,
                receiver: activeChatUser,
                message: message
            });
            input.value = '';
        }
    });

    function handleImageUpload(input) {
        const file = input.files[0];
        if (file && activeChatUser) {
            const caption = prompt("توضیحات عکس (کپشن) را وارد کنید (اختیاری):") || "";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const resizedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    const base64Data = resizedBase64 + '||caption||' + caption;

                    socket.emit('send_private_message', {
                        sender: currentUser.username,
                        receiver: activeChatUser,
                        message: base64Data
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            input.value = '';
        }
    }

    function openImageModal(src) {
        const modal = document.getElementById('imageModal');
        modal.querySelector('img').src = src;
        modal.style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    socket.on('receive_private_message', (data) => {
        playBeepSound();
        if (data.sender === activeChatUser) {
            appendMessage(data.sender, data.message);
        } else {
            unreadCounts[data.sender] = (unreadCounts[data.sender] || 0) + 1;
            const badge = document.getElementById(`badge-${data.sender}`);
            if (badge) {
                badge.innerText = unreadCounts[data.sender];
                badge.style.display = 'inline-block';
            }
        }
    });

    socket.on('message_sent', (data) => {
        if (data.receiver === activeChatUser) appendMessage(data.sender, data.message);
    });

    function logout() {
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    loadUsers();
</script>

</body>
</html>
