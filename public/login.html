<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت نام | MyMessenger</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background-color: #ffe6e8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 30px 25px; border-radius: 20px; width: 100%; max-width: 360px; text-align: center; }
    h2 { color: #d81b60; margin-bottom: 20px; font-size: 24px; }
    input { width: 100%; padding: 12px 15px; margin: 8px 0; border: 1px solid #f3c2d3; border-radius: 10px; outline: none; background: #fdf8f9; font-size: 14px; }
    input:focus { border-color: #e91e63; background: #fff; }
    .gender-box { display: flex; justify-content: space-between; gap: 10px; margin: 12px 0; }
    .gender-btn { flex: 1; padding: 10px; border: 1px solid #f3c2d3; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; }
    .gender-btn.active { background: #e91e63; color: #fff; border-color: #e91e63; }
    .btn { width: 100%; padding: 12px; background: #e91e63; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
    .btn:hover { background: #c2185b; }
    .toggle-link { margin-top: 15px; font-size: 13px; color: #666; }
    .toggle-link span { color: #e91e63; cursor: pointer; font-weight: bold; }
    .hidden { display: none; }
    .hint { font-size: 12px; color: #888; text-align: right; margin-top: 4px; }
    .error { color: #c62828; font-size: 13px; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
<div class="card">
  <div id="registerSection">
    <h2>ساخت حساب</h2>
    <form id="registerForm">
      <input type="text" id="regUsername" placeholder="نام کاربری" required minlength="3" maxlength="32" autocomplete="username">
      <input type="email" id="regEmail" placeholder="ایمیل (اختیاری)" autocomplete="email">
      <input type="text" id="regPhone" placeholder="شماره موبایل (اختیاری)" autocomplete="tel">
      <input type="password" id="regPassword" placeholder="رمز عبور (حداقل ۸ کاراکتر)" required minlength="8" maxlength="72" autocomplete="new-password">
      <input type="password" id="regConfirmPassword" placeholder="تکرار رمز عبور" required minlength="8" maxlength="72" autocomplete="new-password">
      <div class="gender-box">
        <button type="button" class="gender-btn active" id="btnFemale">زن</button>
        <button type="button" class="gender-btn" id="btnMale">مرد</button>
      </div>
      <button type="submit" class="btn">ثبت نام</button>
    </form>
    <div class="toggle-link">حساب کاربری دارید؟ <span id="toLogin">ورود</span></div>
  </div>
  <div id="loginSection" class="hidden">
    <h2>ورود به حساب</h2>
    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="نام کاربری" required autocomplete="username">
      <input type="password" id="loginPassword" placeholder="رمز عبور" required autocomplete="current-password">
      <button type="submit" class="btn">ورود</button>
    </form>
    <div class="toggle-link">حساب کاربری ندارید؟ <span id="toRegister">ثبت نام</span></div>
  </div>
  <div class="error" id="formError"></div>
</div>
<script src="/js/api.js"></script>
<script>
  let selectedGender = 'زن';
  const formError = document.getElementById('formError');

  document.getElementById('btnFemale').onclick = () => {
    selectedGender = 'زن';
    document.getElementById('btnFemale').classList.add('active');
    document.getElementById('btnMale').classList.remove('active');
  };
  document.getElementById('btnMale').onclick = () => {
    selectedGender = 'مرد';
    document.getElementById('btnMale').classList.add('active');
    document.getElementById('btnFemale').classList.remove('active');
  };
  document.getElementById('toLogin').onclick = () => {
    document.getElementById('registerSection').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
    formError.textContent = '';
  };
  document.getElementById('toRegister').onclick = () => {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('registerSection').classList.remove('hidden');
    formError.textContent = '';
  };

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.textContent = '';
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
    if (password !== confirmPassword) {
      formError.textContent = 'رمز عبور و تکرار آن یکسان نیستند.';
      return;
    }
    try {
      await api('/api/register', {
        method: 'POST',
        body: {
          username: document.getElementById('regUsername').value.trim(),
          email: document.getElementById('regEmail').value.trim(),
          phone: document.getElementById('regPhone').value.trim(),
          password,
          gender: selectedGender,
        },
      });
      window.location.href = '/profile.html';
    } catch (err) {
      formError.textContent = err.message;
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.textContent = '';
    try {
      await api('/api/login', {
        method: 'POST',
        body: {
          username: document.getElementById('loginUsername').value.trim(),
          password: document.getElementById('loginPassword').value,
        },
      });
      window.location.href = '/chat.html';
    } catch (err) {
      formError.textContent = err.message;
    }
  });
</script>
</body>
</html>
